[package]
name = "usb-copy"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"

[dependencies]
eframe = { version = "0.34.1", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
tempfile = "3"
